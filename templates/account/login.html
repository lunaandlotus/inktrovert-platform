{% extends "base.html" %}
{% block title %}Sign in — {{ site_name }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Sign in</h2>
  <form method="post" action="{{ url_for('account.login', next=next) if next else url_for('account.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn btn-gold" type="submit">Sign in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('account.register') }}">Join free</a>.</p>
</div>
{% endblock %}
