{% extends "base.html" %}

{% block title %}Submit an event — Inktrovert{% endblock %}

{% block content %}
<h1>Submit an event</h1>
<p>Running a convention, expo, shop night, or seminar? Send the details and the
   magazine team will give it a look before it goes on the calendar. Free to submit.</p>

<form method="post" action="{{ url_for('public.event_submit') }}" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-group">
    <label for="title">Event name *</label>
    <input type="text" id="title" name="title" required maxlength="250">
  </div>

  <div class="form-group">
    <label for="starts_at">Date</label>
    <input type="datetime-local" id="starts_at" name="starts_at">
  </div>

  <div class="form-group">
    <label for="venue_name">Venue</label>
    <input type="text" id="venue_name" name="venue_name" maxlength="200">
  </div>

  <div class="form-group">
    <label for="city">City</label>
    <input type="text" id="city" name="city" maxlength="120">
  </div>

  <div class="form-group">
    <label for="state">State</label>
    <input type="text" id="state" name="state" maxlength="60">
  </div>

  <div class="form-group">
    <label for="url">Event website</label>
    <input type="url" id="url" name="url" maxlength="500" placeholder="https://">
  </div>

  <div class="form-group">
    <label for="description">Details</label>
    <textarea id="description" name="description" rows="6" placeholder="What is it, who's there, what should people know?"></textarea>
  </div>

  <button type="submit" class="btn btn-gold">Send it in</button>
</form>
{% endblock %}
